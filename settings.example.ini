# ClearCoreStackLight settings. Copy to the root of the ClearCore's microSD card as settings.ini.
# One key=value per line. Lines starting with # or ; are comments; " #" also starts a comment.
# Unknown keys and bad values are reported on the USB serial port at boot and ignored.

# --- MQTT broker --------------------------------------------------------------------------------
broker=192.168.1.10        # IP address or host name
port=1883
user=                      # leave empty if the broker allows anonymous clients
password=

# --- Topics: {project}/{client}/{site}/{role}/{kind} ---------------------------------------------
# Lowercase letters, digits and hyphens. The role names the job ("cc-01" = controller 1 at this
# site); keep it when a unit is swapped. The asset tag names the physical unit and is used as the
# MQTT client ID, so it must be unique on the broker.
project=stacklight
client=acme
site=main-plant
role=cc-01
asset=cc-0001

# --- Network ------------------------------------------------------------------------------------
ip=dhcp                    # or a static address, with gateway, dns and subnet below
#gateway=192.168.1.1
#dns=192.168.1.1
#subnet=255.255.255.0

# --- Light outputs: IO0..IO5, or none --------------------------------------------------------------
# Nothing is driven until a channel names a pin. YELLOW/ORANGE light red + green together.
red=none
green=none
blue=none
alarm=none
button=none                # IO0..IO5 or DI6..DI8; publishes "button" on the event topic

# Brightness of each colour when lit, 0..100 % (one decimal allowed, e.g. 27.5). Below 100 the output runs as PWM. Turn the brighter colour
# down until mixes such as YELLOW look right. Try values live with "level green 40" on the USB console,
# then "save" writes them here.
red_level=100
green_level=100
blue_level=100

# --- Addressable strip (optional) -------------------------------------------------------------------
# A WS2805 strip on a COM port shows the same colours and blinking as the light, every pixel alike.
# Wiring (RJ-45 pins): 5 = data (strip DIN, and BIN on dual-data strips), 4 = GND; leave 2 and 6 (5 V)
# unconnected. The strip is powered from the 24 V supply, not the ClearCore.
# Leave strip=none if the port has anything else on it (e.g. a CCIO-8).
strip=none                 # COM0, COM1 or none
#strip_pixels=50           # 1..300
strip_order=RGB            # colour order on the wire: RGB (WS2805 datasheet) or GRB (BTF's WS2805 strip), ...
strip_timing=4             # signal timing 0..5 (see Strip.h); 4 is verified on BTF's WS2805 strip
strip_red_level=100        # brightness of each colour on the strip, 0..100 %
strip_green_level=100
strip_blue_level=100

# --- Blink timing (ms) -----------------------------------------------------------------------------
fast_on=350
fast_off=150
slow_on=750
slow_off=250

# --- Remote reset -----------------------------------------------------------------------------------
# true lets "RESET" on {...}/reset reboot the board. Anyone who can publish to the broker can use it.
allow_reset=false
