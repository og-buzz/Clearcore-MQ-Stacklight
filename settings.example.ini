# ClearCoreStackLight settings. Copy to the root of the ClearCore's microSD card as settings.ini.
# One key=value per line. Lines starting with # or ; are comments; " #" also starts a comment.
# Unknown keys and bad values are reported on the USB serial port at boot and ignored.

# --- MQTT broker --------------------------------------------------------------------------------
broker=192.168.1.10        # IP address or host name
port=1883
user=                      # leave empty if the broker allows anonymous clients
password=

# --- Topics: {project}/{client}/{site}/{role}/{kind} ---------------------------------------------
# Lowercase letters, digits and hyphens. The role names the job ("cc-01" = controller 1 at this
# site); keep it when a unit is swapped. The asset tag names the physical unit and is used as the
# MQTT client ID, so it must be unique on the broker.
project=stacklight
client=acme
site=main-plant
role=cc-01
asset=cc-0001

# --- Network ------------------------------------------------------------------------------------
ip=dhcp                    # or a static address, with gateway, dns and subnet below
#gateway=192.168.1.1
#dns=192.168.1.1
#subnet=255.255.255.0

# --- Light outputs: IO0..IO5, or none --------------------------------------------------------------
# Nothing is driven until a channel names a pin. YELLOW/ORANGE light red + green together.
red=none
green=none
blue=none
alarm=none
button=none                # IO0..IO5 or DI6..DI8; publishes "button" on the event topic

# Brightness isn't set here: it comes with each command (e.g. IO5=26), so the publisher balances the colours.

# --- Addressable strip (optional) -------------------------------------------------------------------
# A WS2805 strip on a COM port: STRIP items in the commands set its pixels; without them it shows the colour names.
# Wiring (RJ-45 pins): 5 = data (strip DIN, and BIN on dual-data strips), 4 = GND; leave 2 and 6 (5 V)
# unconnected. The strip is powered from the 24 V supply, not the ClearCore.
# Leave strip=none if the port has anything else on it (e.g. a CCIO-8).
strip=none                 # COM0, COM1 or none
#strip_pixels=50           # 1..300
strip_order=RGB            # colour order on the wire: RGB (WS2805 datasheet) or GRB (BTF's WS2805 strip), ...
strip_timing=4             # signal timing 0..5 (see Strip.h); 4 is verified on BTF's WS2805 strip
strip_layout=line          # line, ring, fold, or a map like 0-24|49-25 (see README)

# --- Blink timing (ms) -----------------------------------------------------------------------------
fast_on=350
fast_off=150
slow_on=750
slow_off=250

# --- Transitions ---------------------------------------------------------------------------------------
# A change of look fades in over this many ms (0..10000, 0 = at once): the light outputs crossfade, and on the strip
# the new look sweeps in from position 0 with sparkles in its colour, at least transition_sparkle % bright (0 = none).
transition=2000
transition_sparkle=20

# --- Remote reset -----------------------------------------------------------------------------------
# true lets "RESET" on {...}/reset reboot the board. Anyone who can publish to the broker can use it.
allow_reset=false

# --- Scenes ----------------------------------------------------------------------------------------
# Named light commands (at most 16, 240 characters each). The Teams states available, busy, call, dnd, away, brb,
# offline, unknown and stale have built-in looks (GREEN, RED, RED, RED,SLOW, YELLOW, YELLOW,SLOW, OFF, OFF, OFF);
# a scene of the same name replaces one. "scene <name>" on {...}/scene or the USB console shows a scene.
# PIX[n] items address physical pixels (0 = the first after the ClearCore), whatever strip_layout says.
#scene_busy=IO4=100;STRIP=0,0,0,3,0;PIX[12]=5,0,0;PIX[26]=5,0,0
#scene_focus=STRIP=0,0,0,3,0;PIX[38-20]=PULSE,0/0/0/0/2,0/0/0/0/8,6000MS

# --- Following a person -----------------------------------------------------------------------------
# With both set, the light follows <presence>/<owner>: each Teams state published there (busy, dnd, ...) shows
# the scene of that name, and "offline" on <presence>/publisher (the publisher's Last Will) shows the stale scene.
# A retained command on {...}/command is then ignored at connect; live commands still apply until the next state.
#owner=someone@example.com
#presence=ctms/presence

# --- Scenes over MQTT ----------------------------------------------------------------------------------
# true lets "scene_<name>=<command>" on {...}/config save a scene to this file (and "scene_<name>=" remove one).
# Nothing else can be set this way. Anyone who can publish to the broker can change the scenes.
allow_config=false
